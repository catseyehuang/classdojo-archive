name: ClassDojo Daily Sync

on:
  schedule:
    # 台灣時間 (Asia/Taipei, UTC+8) 週一至週五 17:05, 18:05, 19:05, 20:05, 21:05 執行一次
    # （避開 GitHub Actions 整點 :00 全球尖峰排隊與丟失） => UTC 09:05, 10:05, 11:05, 12:05, 13:05
    - cron: '5 9,10,11,12,13 * * 1-5'
    # 台灣時間 (Asia/Taipei, UTC+8) 週六與週日 每日 19:35 => UTC 11:35
    - cron: '35 11 * * 0,6'
  workflow_dispatch: # 支援在 GitHub Actions 頁面手動一鍵觸發執行

jobs:
  sync:
    name: Sync Latest ClassDojo Posts & Mirror Media to R2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Sync Pipeline
        env:
          CI: true
          DOJO_STORAGE_STATE: ${{ secrets.DOJO_STORAGE_STATE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: npm run sync:daily
