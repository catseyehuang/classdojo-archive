<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFA570" />
      <stop offset="100%" stop-color="#9C6B30" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF6F2" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7F6234" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Notebook Back / Shadow -->
  <rect x="10" y="6" width="46" height="52" rx="6" fill="#7F6234" opacity="0.3" filter="url(#shadow)" />

  <!-- Notebook Cover -->
  <rect x="8" y="6" width="46" height="52" rx="6" fill="url(#coverGrad)" />

  <!-- Spine stitch line -->
  <line x1="16" y1="6" x2="16" y2="58" stroke="#FAF6F2" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Inner Page -->
  <rect x="19" y="10" width="31" height="44" rx="3" fill="url(#pageGrad)" />

  <!-- Page Lines (Contact Book Grid/Lines) -->
  <line x1="23" y1="18" x2="46" y2="18" stroke="#DFB780" stroke-width="1.8" stroke-linecap="round" />
  <line x1="23" y1="25" x2="46" y2="25" stroke="#E6C89F" stroke-width="1.2" stroke-linecap="round" />
  <line x1="23" y1="32" x2="46" y2="32" stroke="#E6C89F" stroke-width="1.2" stroke-linecap="round" />
  <line x1="23" y1="39" x2="40" y2="39" stroke="#E6C89F" stroke-width="1.2" stroke-linecap="round" />

  <!-- Little Red Bookmark Ribbon -->
  <path d="M37 6 L37 20 L40.5 17 L44 20 L44 6 Z" fill="#E24A4A" />

  <!-- Cute Checkmark on Assignment -->
  <path d="M23 45 L26 48 L33 42" fill="none" stroke="#2E7D32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="36" y1="46" x2="46" y2="46" stroke="#CFA570" stroke-width="1.5" stroke-linecap="round" />
</svg>